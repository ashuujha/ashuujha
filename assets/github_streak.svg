<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 195" width="100%" height="195">
  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 600; fill: #58a6ff; }
    .streak-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 700; fill: #c9d1d9; }
    .streak-num-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: 700; fill: #58a6ff; }
    .streak-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
    .streak-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
    .unavailable { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #8b949e; }
  </style>
  <rect width="450" height="195" rx="4.5" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <text x="25" y="35" class="card-title">GitHub Streak</text>
  <text x="225" y="105" text-anchor="middle" class="unavailable">Streak data currently unavailable from GitHub API</text>
</svg>